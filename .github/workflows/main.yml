name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Website, Fix White Screen & Generate APK
        run: |
          # ==========================================
          # 1. CHANGE YOUR APP NAME BELOW:
          APP_NAME="SK Panchapachi"
          APP_ID="com.sk.panchapachi"
          # ==========================================

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          # Find icon file if uploaded to repo
          ICON_SOURCE=""
          for f in icon.png logo.png icon.jpg logo.jpg; do
            if [ -f "$f" ]; then
              ICON_SOURCE="$(pwd)/$f"
              break
            fi
          done

          # Build React/Vite project with relative paths so screen isn't blank
          if [ -f "package.json" ]; then
            sed -i 's/base\s*:\s*["'\''][^"'\'']*["'\'']/base: ".\/"/g' vite.config.* 2>/dev/null || true
            npm install --legacy-peer-deps || npm install --force || true
            npx vite build --base=./ || npm run build -- --base=./ || npm run build || true
          fi

          # Create Cordova project with reliable ASCII project name, then set Display Name
          npm install -g cordova
          rm -rf /tmp/MyApp
          cordova create /tmp/MyApp "$APP_ID" "SKPanchapachi"
          rm -rf /tmp/MyApp/www/*

          # Copy built website files
          if [ -d "dist" ]; then
            cp -r dist/* /tmp/MyApp/www/
          elif [ -d "build" ]; then
            cp -r build/* /tmp/MyApp/www/
          else
            find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'github' ! -name 'node_modules' -exec cp -r {} /tmp/MyApp/www/ \;
          fi

          # Ensure index.html exists
          if [ ! -f "/tmp/MyApp/www/index.html" ]; then
            FIRST_HTML=$(find /tmp/MyApp/www -maxdepth 2 -name "*.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" /tmp/MyApp/www/index.html
            fi
          fi

          # Fix root paths (/assets -> ./assets) and React Router white screen
          if [ -f "/tmp/MyApp/www/index.html" ]; then
            sed -i 's|src="/|src="./|g; s|href="/|href="./|g' /tmp/MyApp/www/index.html
            sed -i '/<meta http-equiv="Content-Security-Policy"/d' /tmp/MyApp/www/index.html
            sed -i 's|<head>|<head><script>if(window.location.pathname.endsWith("/index.html")){window.history.replaceState(null,"","/");}</script>|' /tmp/MyApp/www/index.html
          fi

          cd /tmp/MyApp

          # Set exact display APP_NAME and allow external CDNs in config.xml
          sed -i "s|<name>.*</name>|<name>$APP_NAME</name>|g" config.xml
          sed -i 's|</widget>|  <allow-navigation href="*" />\n  <access origin="*" />\n  <preference name="AndroidInsecureFileModeEnabled" value="true" />\n</widget>|' config.xml

          # Convert and register custom icon cleanly via Cordova config.xml
          if [ -n "$ICON_SOURCE" ]; then
            sudo apt-get update -y && sudo apt-get install -y imagemagick || true
            convert "$ICON_SOURCE" -resize 512x512! /tmp/MyApp/icon_clean.png 2>/dev/null || cp "$ICON_SOURCE" /tmp/MyApp/icon_clean.png
            sed -i 's|</widget>|  <icon src="icon_clean.png" />\n</widget>|' config.xml
          fi

          cordova platform add android@14.0.1

          # Also overwrite mipmap PNGs safely (including foreground) if custom icon exists
          if [ -f "/tmp/MyApp/icon_clean.png" ]; then
            rm -rf platforms/android/app/src/main/res/mipmap-anydpi-v26
            rm -rf platforms/android/app/src/main/res/mipmap-anydpi
            for dir in platforms/android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp /tmp/MyApp/icon_clean.png "$dir/ic_launcher.png" || true
                cp /tmp/MyApp/icon_clean.png "$dir/ic_launcher_round.png" || true
                cp /tmp/MyApp/icon_clean.png "$dir/ic_launcher_foreground.png" || true
              fi
            done
          fi

          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/MyApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
